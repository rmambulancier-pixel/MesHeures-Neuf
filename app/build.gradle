plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def versionProps = new Properties()
file('../version.properties').withInputStream { versionProps.load(it) }
def releaseVersion = versionProps['VERSION']
def releaseCode = versionProps['VERSION_CODE'].toInteger()

android {
    namespace 'com.mesheures.app'
    compileSdk 37
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.mesheures.app'
        minSdk 26
        targetSdk 37
        versionCode releaseCode
        versionName releaseVersion
    }
    signingConfigs {
        release {
            def ks = System.getenv('MESHEURES_KEYSTORE')
            def sp = System.getenv('MESHEURES_STORE_PASSWORD')
            def kp = System.getenv('MESHEURES_KEY_PASSWORD')
            def alias = System.getenv('MESHEURES_KEY_ALIAS')
            if (ks && sp && kp && alias) {
                storeFile = file(ks)
                storePassword = sp
                keyAlias = alias
                keyPassword = kp
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MESHEURES_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.webkit:webkit:1.17.0'
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
